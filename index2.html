```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Chatbot IA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.chat-container {
    width: 100%;
    max-width: 650px;
    height: 90vh;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 20px #0002;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    background: #2563eb;
    color: white;
    padding: 18px;
    text-align: center;
}

header h2 {
    margin: 0 0 5px;
}

header small {
    color: #e0eaff;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e9edf3;
    color: #222;
    margin-right: auto;
}

#status {
    padding: 0 15px 8px;
    font-size: 12px;
    color: #666;
}

form {
    display: flex;
    gap: 8px;
    padding: 15px;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#clear {
    background: #475569;
    margin: 0 15px 12px;
}

@media (max-width: 500px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">
    <header>
        <h2>🤖 Mon Chatbot IA</h2>
        <small>Assistant intelligent</small>
    </header>

    <div id="messages">
        <div class="message bot">
            Bonjour ! 👋 Je suis ton assistant IA.
            Pose-moi une question pour commencer.
        </div>
    </div>

    <div id="status">Prêt à discuter</div>

    <form id="chatForm">
        <input
            id="userInput"
            type="text"
            placeholder="Écris ton message..."
            autocomplete="off"
            required
        >
        <button id="sendBtn" type="submit">Envoyer</button>
    </form>

    <button id="clear" type="button">Nouvelle conversation</button>
</div>

<script>
const API_KEY = "COLLE_TA_CLE_API_ICI";
const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const MODEL = "openai/gpt-4o-mini";

const messagesBox = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");
const clearBtn = document.getElementById("clear");

let conversation = [];

function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
    return div;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const text = input.value.trim();

    if (!text || sendBtn.disabled) return;

    if (!API_KEY || API_KEY === "COLLE_TA_CLE_API_ICI") {
        addMessage(
            "Erreur : ajoute ta clé API OpenRouter dans la variable API_KEY du code.",
            "bot"
        );
        return;
    }

    addMessage(text, "user");
    conversation.push({
        role: "user",
        content: text
    });

    input.value = "";
    sendBtn.disabled = true;
    statusBox.textContent = "L'IA réfléchit...";
    
    const loading = addMessage("Réponse en cours...", "bot");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + API_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: MODEL,
                messages: conversation,
                temperature: 0.7
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                "Erreur HTTP " + response.status
            );
        }

        const answer = data.choices?.[0]?.message?.content;

        if (!answer) {
            throw new Error("L'API n'a retourné aucune réponse.");
        }

        loading.textContent = answer;

        conversation.push({
            role: "assistant",
            content: answer
        });

        statusBox.textContent = "Connecté à l'IA";

    } catch (error) {
        loading.textContent = "Erreur : " + error.message;
        statusBox.textContent = "Échec de la connexion";

        // Permet de réessayer sans garder un message non répondu.
        conversation.pop();
    } finally {
        sendBtn.disabled = false;
        input.focus();
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }
});

clearBtn.addEventListener("click", function() {
    conversation = [];
    messagesBox.replaceChildren();

    addMessage(
        "Nouvelle conversation ! Bonjour, comment puis-je t'aider ?",
        "bot"
    );

    statusBox.textContent = "Nouvelle conversation";
    input.focus();
});
</script>

</body>
</html>
